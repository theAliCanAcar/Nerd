[package]
name = "nerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "nerd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
keyring = "3"
nerd-terminal = { path = "../nerd-terminal" }
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu", "wayland", "x11"] }
serde_json = "1"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder"] }
wgpu = { version = "27", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }
